name: 🐛 Bug Report
description: Create a report to help us reproduce and fix a bug in SubZero.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the sections below so we can investigate and fix it promptly.

  - type: input
    id: version
    attributes:
      label: SubZero Version
      description: What version of SubZero are you running? (e.g., 2.2.0)
      placeholder: "2.2.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What OS are you running SubZero on?
      options:
        - Windows 10 / 11
        - Linux (Ubuntu / Debian / Kali)
        - macOS
        - Docker Container
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Start the server with `python app.py`
        2. Enter domain `example.com`
        3. Click 'Start Recon'
        4. See error in console / logs
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Terminal Logs / Screenshots
      description: Paste any error traceback or terminal logs.
      render: shell
